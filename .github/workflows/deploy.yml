name: Deploy Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Two pushes in quick succession must not deploy on top of each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          # Falls back to 22 if the secret is unset, instead of sending an
          # empty string that overrides the action's own default.
          port: ${{ secrets.EC2_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            set -euo pipefail

            cd "${{ secrets.PROJECT_PATH }}"

            # If any step below fails, do not leave the site in maintenance mode.
            trap 'php artisan up || true' EXIT

            git fetch origin main

            # `.env` and everything under storage/ are server state, not repo
            # state. They must survive a deploy. These excludes only work once
            # `.env` is untracked — while it is committed, reset --hard
            # overwrites it regardless of what clean is told to skip.
            git reset --hard origin/main
            git clean -fd -e .env -e /storage -e /public/storage

            composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

            php artisan down --retry=15

            # --force is mandatory: without it artisan refuses to migrate in a
            # production environment and this step fails every time.
            php artisan migrate 

            php artisan optimize:clear
            # `optimize` caches config, routes, views and events in one go —
            # the three individual :cache calls it replaces were redundant.
            php artisan optimize

             if [ ! -L public/storage ]; then
                  php artisan storage:link
              fi

            # Queue workers hold the old code in memory until told otherwise.
            php artisan queue:restart

            php artisan up

            # Requires a NOPASSWD sudoers entry for this exact command,
            # otherwise the step hangs waiting for a password and times out.
            sudo systemctl reload apache2

            # If the stack runs php-fpm rather than mod_php, the reload above
            # does not clear opcache. Uncomment and set the right version:
            # sudo systemctl reload php8.3-fpm
